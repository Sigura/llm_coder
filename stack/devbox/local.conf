# devbox model provider "local": this machine's servers for OpenCode in any devbox project.
# Install: mkdir -p ~/.config/devbox/llm && ln -s ~/llm_coder/stack/devbox/local.conf ~/.config/devbox/llm/local.conf
# Then in a project: devbox llm use --keep local. Format: ml2claude-devbox docs/opencode.md.
# IDs are the model names the servers answer to (ALIAS in config/models/<id>.env); the key files are
# LLM_ROOT/secrets/<KEY_ID>.key, mounted read-only, never copied.
LLM_SERVERS=(
  "deepseek-v4.1-flash http://llm-local:8080/v1 key=~/llm_coder/llm/secrets/deepseek-v4.1-flash-1017.key ctx=655360 out=32768"
  "qwen3.8-27b         http://llm-local:8086/v1 key=~/llm_coder/llm/secrets/qwen3.8-27b.key              ctx=65536  out=32768"
  "qwen3.6-35b-a3b-mtp http://llm-local:8085/v1 key=~/llm_coder/llm/secrets/qwen3.6-35b-a3b-mtp.key      ctx=65536  out=32768"
)
# The coding eval's best setup (docs/pair-eval-winners.md, docs/ff-study.md): DeepSeek writes; devbox's OpenCode
# plugin (OPENCODE_GATE) runs the compile gate after each edit and has Qwen3.8 review the diff when a turn ends.
LLM_MODEL=deepseek-v4.1-flash
LLM_SMALL_MODEL=qwen3.6-35b-a3b-mtp
LLM_AGENTS=(fast=qwen3.8-27b)
LLM_REVIEWER=qwen3.8-27b
# opencode/: AGENTS.md, a copy of eval/writer-rules2.txt (the folder is mounted alone in other containers), and
# /review, a review on demand by llm-review.sh. scripts/: llm-review.sh on PATH, reaching the servers through
# LLM_SERVER_<ID>_URL and _KEY.
LLM_CONFIG_DIR=~/llm_coder/stack/devbox/opencode
LLM_TOOLS_DIR=~/llm_coder/stack/scripts
