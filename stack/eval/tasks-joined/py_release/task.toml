lang = "python"
file = "solution.py"
prompt = """
Write one Python module for a small package-release tool. It consists of four parts; implement all of them in
the same file. The functions of parts 1-3 are tested on their own too, so keep their exact names and
signatures.

## Part 1

Implement npm-style semantic version ranges.

`parse(v: str) -> Version`: SemVer 2.0.0 `MAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]`; no leading zeros in numeric
parts or numeric prerelease identifiers; identifiers `[0-9A-Za-z-]+`, non-empty. A leading `v` or `=` is allowed and
ignored. Invalid input raises `ValueError`. `Version` objects must be totally ordered by SemVer precedence (build
metadata ignored; prerelease < release; prerelease identifiers compared numerically when both numeric, numeric <
alphanumeric, ASCII order otherwise, a shorter prefix list is smaller) and `==` must follow precedence too.

`satisfies(version: str, rng: str) -> bool` and `max_satisfying(versions: list[str], rng: str) -> str | None`
(return the original string). Range grammar:
- A range is one or more comparator sets joined by `||`; it matches if any set matches. A set is
  whitespace-separated comparators that must all match. An empty set or `*` matches any release.
- Comparators: `<`, `<=`, `>`, `>=`, `=` or none, followed by a (possibly partial) version.
- Partial versions / X-ranges: `1`, `1.x`, `1.2.*`, `X`. `1.2.x` means `>=1.2.0 <1.3.0`; `1` means `>=1.0.0 <2.0.0`.
  With operators: `>1.2` means `>=1.3.0`, `<=1.2` means `<1.3.0`, `<1.2` means `<1.2.0`, `>=1.2` means `>=1.2.0`.
- Tilde: `~1.2.3` is `>=1.2.3 <1.3.0`; `~1.2` is `>=1.2.0 <1.3.0`; `~1` is `>=1.0.0 <2.0.0`.
- Caret: `^1.2.3` is `>=1.2.3 <2.0.0`; `^0.2.3` is `>=0.2.3 <0.3.0`; `^0.0.3` is `>=0.0.3 <0.0.4`; `^1.2.x` is
  `>=1.2.0 <2.0.0`; `^0.0.x` is `>=0.0.0 <0.1.0`; `^0.x` is `>=0.0.0 <1.0.0`.
- Hyphen: `1.2.3 - 2.3.4` is `>=1.2.3 <=2.3.4`; a partial upper bound is exclusive of the next: `1.2.3 - 2.3` is
  `>=1.2.3 <2.4.0`; a partial lower bound fills zeros.
- Prereleases: a version with a prerelease only satisfies a set if some comparator in that set has a version with the
  same `MAJOR.MINOR.PATCH` and a prerelease (e.g. `1.2.3-alpha.7` satisfies `>1.2.3-alpha.3` but `3.4.5-alpha.9` does
  not), and it must still satisfy all comparators.
- An invalid range raises `ValueError`.

## Part 2

Implement `load(cls, data)` that builds an instance of a (possibly nested) `@dataclass` type `cls` from
JSON-like `data` (dicts, lists, str, int, float, bool, None), validating types from the dataclass field annotations.

Supported annotations: `int`, `float`, `str`, `bool`, `None`, nested dataclasses, `list[T]`, `dict[str, T]`,
`tuple[T, ...]`, `tuple[A, B, C]` (fixed length, from a JSON list), `T | None` / `Optional[T]`, unions like `int | str`
(try members left to right, first that loads wins; if none loads, the error path is the union's own path), and `Literal[...]` values (the value must equal a literal and have the same type). Annotations may be strings because
the module uses `from __future__ import annotations`; resolve them with `typing.get_type_hints`.

Rules:
- `bool` is not accepted for `int` or `float`. An `int` is accepted for `float` and converted to float.
  Nothing else is coerced (no "3" -> 3).
- Missing keys use the field default or default_factory; a missing key without a default is an error.
  Unknown keys are an error.
- On any error raise `LoadError` (define it, subclass of `ValueError`) whose `path` attribute is the location
  as a string, and whose `str()` starts with that path followed by `: `. Path format: `$` for the root, `.name` for a
  field or dict key, `[i]` for list/tuple index, e.g. `$.servers[2].ports[0]`. For a missing field, the path points
  at the missing field (`$.servers[2].host`). For `T | None` with non-null data, report the error from loading `T` (so the path can point deep inside it).
  For unknown keys, the path points at the first unknown key in the
  input dict's order.

## Part 3

Implement `flatten(obj, sep=".") -> dict` and `unflatten(flat: dict, sep=".")`.

`flatten` turns nested dicts and lists into a flat dict with path keys: dict keys are joined with `sep`, list items use
their index (`a.0.b`). Empty dicts and empty lists are kept as leaf values (`{"a": {}}` -> `{"a": {}}`). Any other
value is a leaf. The top-level object must be a dict (else `TypeError`). Keys must be strings that don't contain `sep`
(else `ValueError`). Order: depth-first, in the input's order.

`unflatten` is the inverse: a path segment that is a non-negative integer without leading zeros (`0`, `12`) creates
a list. Lists must be dense: the indices of a list must be exactly `0..n-1` in any input order (else `ValueError`).
Conflicts such as `{"a": 1, "a.b": 2}` raise `ValueError`.

## Part 4: `Manifest` and `resolve`

Define this dataclass in the module (exactly these fields, types and defaults):

```python
@dataclass
class Manifest:
    name: str
    version: str
    dependencies: dict[str, str] = field(default_factory=dict)   # package -> range
    dev: dict[str, str] = field(default_factory=dict)            # package -> range
    private: bool = False
```

Implement `resolve(manifest: dict, available: dict[str, list[str]]) -> dict` using the functions above:

- Build the manifest with `load(Manifest, manifest)`; its `LoadError` propagates unchanged.
- `version` must be a valid SemVer version (`parse`), else `ValueError`.
- For every package in `dependencies`, then in `dev`, pick `max_satisfying(available.get(package, []), range)`.
  If nothing satisfies, raise `ValueError` whose message contains the package name. Invalid ranges raise `ValueError`.
- Return `flatten({"name": ..., "version": ..., "dependencies": {package: chosen}, "dev": {package: chosen}},
  sep="/")`, with packages in manifest order. So an empty `dev` stays as the leaf `"dev": {}`, and a package name
  containing `/` raises `ValueError`.
"""
