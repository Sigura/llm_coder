lang = "python"
file = "solution.py"
prompt = """
Write one Python module for a small patch-recipe tool. It consists of four parts; implement all of them in the
same file. The functions of parts 1-3 are tested on their own too, so keep their exact names and signatures.

## Part 1

Implement `split_command(line: str, env: dict[str, str]) -> list[str]`, a subset of POSIX shell word splitting
and parameter expansion. Do not use `shlex`.

- Words are separated by unquoted spaces, tabs and newlines.
- Single quotes: everything literal up to the next `'`.
- Double quotes: literal except `\\` escapes only `$`, `"`, `\\` and newline (backslash-newline is removed);
  any other backslash stays as is. `$` expansion happens inside double quotes.
- Unquoted backslash escapes the next character (backslash-newline is removed entirely).
- Expansion: `$NAME` (longest `[A-Za-z_][A-Za-z0-9_]*`), `${NAME}`, `${NAME:-default}` (default if unset or
  empty; the default text itself undergoes `$` expansion), `${NAME-default}` (default only if unset).
  Unset variables expand to an empty string. A `$` not followed by a name or `{` is literal.
- Field splitting: the result of an UNQUOTED expansion is split on spaces/tabs/newlines into multiple words; quoted
  expansions are not split. A word that is entirely an unquoted expansion that becomes empty is removed, but `""`
  or `''` produce an empty word.
- Adjacent quoted/unquoted parts join into one word (`a"b c"'d'` is `ab cd`).
- Raise `ValueError` for an unterminated quote, an unterminated `${`, or a trailing unescaped backslash.

## Part 2

Implement `apply_patch(original: str, diff: str) -> str` that applies a unified diff (as produced by
`diff -u` / `git diff`, single file) to `original` and returns the patched text.

- Ignore any lines before the first `@@` hunk header (`---`, `+++`, `diff --git`, `index ...`).
- Hunk header: `@@ -l,s +l,s @@ optional section text`. A missing `,s` means a count of 1. A count of 0 with
  start l means "after line l" (l may be 0 for the start of the file).
- Hunk body lines start with ` ` (context), `-` (removed) or `+` (added). The line `\\ No newline at end of file`
  refers to the preceding body line: that line has no trailing newline in its version (old for `-`/context,
  new for `+`/context).
- Apply hunks in order. Each hunk must match at exactly its stated old line number, taking into account the
  line-count changes of earlier hunks. If context or removed lines don't match the text exactly, or the counts in the
  header disagree with the body, raise `ValueError`.
- Lines are split keeping their newline characters; the result must preserve the presence/absence of the final
  newline correctly.

## Part 3

Implement `load_ini(text: str) -> dict[str, dict[str, str]]`. Do not use `configparser`.

- Sections: `[name]` (name trimmed, case-sensitive). Keys before any section go to section `""`, which appears in the result only if it has keys. A repeated section
  header continues the same section.
- Entries: `key = value` or `key: value` (first `=` or `:` splits). Keys are trimmed and lowercased; values trimmed.
  A key without a separator is an error. Repeated keys: last wins.
- Comments: lines starting with `#` or `;` (after optional whitespace). Inline comments: ` ;` or ` #` (whitespace
  before the marker) end the value, unless inside double quotes.
- Quoted values: a value fully wrapped in double quotes has the quotes removed and keeps inner whitespace;
  `\\"` inside quotes is a literal quote.
- Continuation: a non-empty line that starts with whitespace and follows an entry is appended to that entry's value
  with a single `\\n` between (the continuation line is trimmed). Blank lines end a continuation.
- Interpolation (after the whole file is read): `${key}` refers to a key in the same section, `${section:key}` to
  another section; `$$` is a literal `$`. References are resolved recursively. Raise `ValueError` for undefined
  references and for reference cycles (the message must contain the word `cycle` for cycles).
- Raise `ValueError` with the 1-based line number in the message (`line N`) for syntax errors: missing separator,
  unclosed `[`, a continuation line with no preceding entry, an unterminated quote.

## Part 4: `apply_recipe`

Implement `apply_recipe(recipe: str, files: dict[str, str], patches: dict[str, str], env: dict[str, str]) ->
dict[str, str]` using the functions above. It returns the new file contents; `files` must not be mutated.

- `recipe` is INI text read with `load_ini` (its errors propagate). Every section except `""` is one step, applied
  in the order the sections first appear in the text. Keys of a step:
  - `file` (required): the target path. After the INI interpolation, the value is expanded with
    `split_command(value, env)` and must give exactly one word, else `ValueError`. INI interpolation runs
    first, so a shell expansion is written with `$$` in the recipe: `file = $${SRC:-src}/app.py`.
  - `patch` (required): a key of `patches`, the unified diff to apply; an unknown name raises `ValueError`.
  - `enabled` (optional, default `true`): `true` or `false`, case-insensitive; any other value raises `ValueError`.
    A disabled step is skipped entirely (its `file` and `patch` are still required but not checked further).
- A missing required key raises `ValueError`. The diff is applied with `apply_patch` to the file's current content
  (the result of earlier steps; a path not in `files` starts as `""`), and its `ValueError` propagates.
"""
